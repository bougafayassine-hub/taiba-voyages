# Site statique : rien à construire, Netlify publie le dépôt tel quel.
[build]
  publish = "."

# Les fichiers CSS/JS/images portent déjà un numéro de version dans l'URL :
# cache long pour les ressources, court pour les pages HTML.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Page arabe accessible avec ou sans barre finale.
[[redirects]]
  from = "/ar"
  to = "/ar/"
  status = 301
